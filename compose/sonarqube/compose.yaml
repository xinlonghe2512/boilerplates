services:
  sonarqube:
    image: docker.io/sonarqube:26.2.0.119303-community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - ${SONARQUBE_PORT}:9000
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-postgres-db:5432/sonarqube
      - SONAR_JDBC_USERNAME=${SONARQUBE_POSTGRESDB_USER}
      - SONAR_JDBC_PASSWORD=${SONARQUBE_POSTGRESDB_PASSWORD}
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - ./sonarqube/data:/opt/sonarqube/data
      - ./sonarqube/logs:/opt/sonarqube/logs
      - ./sonarqube/extensions:/opt/sonarqube/extensions
    env_file:
      - .env
    depends_on:
      sonarqube-postgres-db:
        condition: service_healthy
    networks:
      - sonarqube-net

  sonarqube-postgres-db:
    image: docker.io/postgres:17.5-alpine
    container_name: sonarqube-postgres-db
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - ${SONARQUBE_POSTGRESDB_PORT}:5432
    environment:
      POSTGRES_USER: ${SONARQUBE_POSTGRESDB_USER}
      POSTGRES_PASSWORD: ${SONARQUBE_POSTGRESDB_PASSWORD}
      POSTGRES_DB: ${SONARQUBE_POSTGRESDB_DATABASE}
    volumes:
      - ./sonarqube-postgres-db/pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${SONARQUBE_POSTGRESDB_USER} -d ${SONARQUBE_POSTGRESDB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sonarqube-net

networks:
  sonarqube-net:
    driver: bridge
