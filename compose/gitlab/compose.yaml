services:
  gitlab:
    image: docker.io/gitlab/gitlab-ce:18.9.0-ce.0
    container_name: gitlab
    restart: unless-stopped
    shm_size: '256m'
    hostname: 'localhost'
    ports:
      - ${GITLAB_HTTP_PORT}:80
      - ${GITLAB_SSH_PORT}:22
    volumes:
      - ./gitlab/config:/etc/gitlab
      - ./gitlab/logs:/var/log/gitlab
      - ./gitlab/data:/var/opt/gitlab
      - gitlab-artifacts:/var/opt/gitlab/gitlab-rails/shared/artifacts
    env_file:
      - .env
    networks:
      - gitlab-network

  gitlab-runner:
    image: docker.io/gitlab/gitlab-runner:alpine-v18.9.0
    container_name: gitlab-runner
    restart: unless-stopped
    volumes:
      - ./gitlab-runner/srv/gitlab-runner/config:/etc/gitlab-runner # Mount a host directory for config persistence
      - /var/run/docker.sock:/var/run/docker.sock # Mount the Docker socket for the Docker executor
    env_file:
      - .env
    networks:
      - gitlab-network

volumes:
  gitlab-artifacts:

networks:
  gitlab-network:
    driver: bridge
